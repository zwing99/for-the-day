[tools]
bun = "1.3.12"
node = "22.16.0"
terraform = "1.10.5"

[tasks.install]
description = "Install locked JavaScript dependencies"
run = "bun install --frozen-lockfile"

[tasks.typecheck]
description = "Check browser and Node-compatible server TypeScript"
run = ["bun x --no-install tsc -p tsconfig.client.json", "bun x --no-install tsc -p tsconfig.server.json"]

[tasks."dev:web"]
description = "Run the localhost Vite frontend"
run = "bun x --no-install vite"

[tasks."dev:api"]
description = "Run the local Node-compatible Hono listener"
run = "bun --watch src/server/listener.ts"

[tasks.test]
description = "Run Docker-independent unit tests"
run = "node node_modules/vitest/vitest.mjs run tests/unit --pool=threads --maxWorkers=2"

[tasks.build]
description = "Build browser assets and Node-compatible API"
run = ["bun x --no-install vite build", "bun build src/server/listener.ts --target=node --outdir=dist/server"]

[tasks."db:start"]
description = "Start persistent DynamoDB Local (requires Docker Desktop)"
run = "bun scripts/start-db.ts"

[tasks."db:stop"]
description = "Stop DynamoDB Local while retaining its data volume"
run = "docker compose stop dynamodb"

[tasks."db:init"]
description = "Wait for DynamoDB Local and initialize the table idempotently"
run = "docker compose run --rm db-init"

[tasks.setup]
description = "Install dependencies, preserve configuration, and prepare local database"
run = ["bun install --frozen-lockfile", "bun scripts/setup.ts", "mise run db:start", "mise run db:init"]

[tasks.dev]
description = "Prepare database and supervise frontend/API; Ctrl-C stops both"
run = ["mise run db:start", "mise run db:init", "bun scripts/dev.ts"]

[tasks.host]
description = "Run the reader on your local network and print phone testing URLs"
run = ["mise run db:start", "mise run db:init", "bun scripts/dev.ts --host"]

[tasks.preview]
description = "Serve the production build and API locally (build first)"
run = ["mise run db:start", "mise run db:init", "bun scripts/dev.ts --preview"]

[tasks.lint]
description = "Check source lint rules"
run = "bun x --no-install biome lint ."

[tasks."format:check"]
description = "Check source formatting"
run = "bun x --no-install biome format ."

[tasks.format]
description = "Format source files"
run = "bun x --no-install biome check --write ."

[tasks.check]
description = "Run typechecking, lint, formatting, and Docker-independent tests"
depends = ["typecheck", "lint", "format:check", "test"]

[tasks."test:domain"]
description = "Run focused pure domain tests"
run = "bun x --no-install vitest run tests/unit/domain"

[tasks."test:client"]
description = "Run Docker-independent reader component and client tests"
run = "bun x --no-install vitest run tests/unit/client"

[tasks."test:providers"]
description = "Run mocked provider adapter tests without credentials or live requests"
run = "bun x --no-install vitest run tests/unit/providers"

[tasks."configure:envrc"]
description = "Prompt for server provider credentials and create a private direnv file"
run = "bash scripts/configure-envrc.sh"

[tasks."inspect:csb"]
description = "Opt-in authenticated CSB samples saved only under ignored .local"
run = "bun scripts/inspect-csb.ts"

[tasks."verify:csb-samples"]
description = "Verify exact text and structure of existing ignored CSB samples offline"
run = "bun scripts/verify-csb-samples.ts"

[tasks."verify:provider-samples"]
description = "Verify saved NIV/NLT/ESV source, normalization, rendering and attribution without network requests"
run = "bun scripts/verify-provider-samples.ts"

[tasks."verify:verse-fit"]
description = "Offline CSB renderer measurement from saved responses (requires Vite and Chrome)"
# Playwright browser shutdown is reliable under Node; Bun builds the TS runner.
# VERSE_FIT_SCOPE=benchmarks checks the standing regression matrix only.
run = ["bun build scripts/verify-verse-fit.ts --target=node --packages=external --outfile=.local/verification/verify-verse-fit.mjs", "node .local/verification/verify-verse-fit.mjs"]

[tasks."cache:import-samples"]
description = "Seed the 30-day development response cache from saved API.Bible samples without network access"
run = "bun scripts/import-provider-cache.ts"

[tasks."test:integration"]
description = "Run isolated DynamoDB Local repository tests (db:start first)"
run = "bun x --no-install vitest run tests/integration"

[tasks."test:browser"]
description = "Verify Chromium/WebKit routes, mobile menus and recovery with invented responses (dev:web first)"
run = ["bun build scripts/verify-browser.ts --target=node --packages=external --outfile=.local/verification/verify-browser.mjs", "node .local/verification/verify-browser.mjs"]

[tasks."smoke:csb"]
description = "Opt-in real CSB API/cache/React smoke test (dev and saved samples required)"
run = "bun x --no-install vitest run tests/manual/csb-smoke.test.tsx"

[tasks."webu:refresh"]
description = "Explicitly download WEBU USFX and refresh pinned public-domain extracts; review before generation"
run = "node scripts/webu-corpus.mjs refresh"

[tasks."webu:generate"]
description = "Generate WEBU static chapters deterministically from pinned extracts without network"
run = "node scripts/webu-corpus.mjs generate"

[tasks."webu:verify"]
description = "Verify pinned WEBU sources and all generated static assets offline"
run = "node scripts/webu-corpus.mjs verify"

[tasks."preview:static"]
description = "Serve the production frontend without API or database (build first)"
run = "bun x --no-install vite preview"

[tasks."webu:update"]
description = "Check upstream WEBU updates and regenerate local assets with footnotes removed"
run = "node scripts/webu-corpus.mjs update"

[tasks."audit:verse-packing"]
description = "Audit rendered packing using invented fixtures and cached CSB responses only (dev:web first)"
run = ["bun build scripts/audit-verse-packing.ts --target=node --packages=external --outfile=.local/verification/audit-verse-packing.mjs", "node .local/verification/audit-verse-packing.mjs"]

[tasks."audit:webu-packing"]
description = "Audit rendered packing across all pinned WEBU chapters without provider access (dev:web first)"
run = ["bun build scripts/audit-verse-packing.ts --target=node --packages=external --outfile=.local/verification/audit-verse-packing.mjs", "node .local/verification/audit-verse-packing.mjs --webu"]

[tasks."terraform:fmt"]
description = "Format Terraform roots and reusable modules"
run = "terraform fmt -recursive terraform"

[tasks."terraform:validate"]
description = "Validate Terraform state roots and rendered IAM policies without provider secrets"
run = ["terraform -chdir=terraform/iam init -backend=false -input=false", "terraform -chdir=terraform/iam validate", "terraform -chdir=terraform/iam plan -refresh=false -input=false -out=/tmp/for-the-day-iam.tfplan", "terraform -chdir=terraform/iam show -json /tmp/for-the-day-iam.tfplan | node scripts/verify-iam-policies.mjs", "terraform -chdir=terraform init -backend=false -input=false", "terraform -chdir=terraform validate"]

[tasks."build:lambda"]
description = "Build a bundled Node 22 Lambda ZIP"
run = "bash scripts/package-lambda.sh"

[tasks."verify:beta"]
description = "Verify public beta DNS/TLS, API health, SPA routes, WEBU JSON, and missing assets without provider requests"
run = "node scripts/verify-beta.mjs"
