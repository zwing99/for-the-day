workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

image: ghcr.io/jdx/mise:2026.9.11-debian

variables:
  MISE_DATA_DIR: "$CI_PROJECT_DIR/.mise"
  MISE_CACHE_DIR: "$CI_PROJECT_DIR/.mise/cache"
  AWS_CLI_VERSION: "2.27.49"

stages:
  - checks
  - build
  - plan
  - deploy
  - verify

unit:
  stage: checks
  cache:
    key:
      prefix: mise-unit-linux-amd64
      files:
        - mise.toml
    paths:
      - .mise/installs/
      - .mise/cache/
  script:
    - mise install node bun
    - mise run install
    - mise run typecheck
    - mise run lint
    - mise run format:check
    - mise run test
  # DynamoDB Local integration tests remain local-only; CI needs no Docker in Docker.

terraform:validate:
  stage: checks
  script:
    - mise install terraform
    - mise exec -- terraform fmt -check -recursive terraform
    - mise exec -- terraform -chdir=terraform init -backend=false -input=false
    - mise exec -- terraform -chdir=terraform validate
    - mise exec -- terraform -chdir=terraform/iam init -backend=false -input=false
    - mise exec -- terraform -chdir=terraform/iam validate
    - mise exec -- terraform -chdir=terraform/iam plan -refresh=false -input=false -out=/tmp/iam-policy.tfplan
    - mise exec -- terraform -chdir=terraform/iam show -json /tmp/iam-policy.tfplan > iam-policy-plan.json
  artifacts:
    paths:
      - iam-policy-plan.json
    expire_in: 1 day

iam:policy-check:
  stage: checks
  needs:
    - job: terraform:validate
      artifacts: true
  script:
    - mise install node
    - mise exec -- node scripts/verify-iam-policies.mjs < iam-policy-plan.json

build:
  stage: build
  cache:
    key:
      prefix: mise-build-linux-amd64
      files:
        - mise.toml
    paths:
      - .mise/installs/
      - .mise/cache/
  needs:
    - unit
    - terraform:validate
    - iam:policy-check
  script:
    - mise install node bun
    - apt-get update && apt-get install -y --no-install-recommends zip && rm -rf /var/lib/apt/lists/*
    - mise run install
    - mise exec -- bun x --no-install vite build
    - mise run build:lambda
  artifacts:
    name: "beta-${CI_COMMIT_SHA}"
    paths:
      - dist/
    expire_in: never

.aws-terraform:
  before_script:
    - |
      set -eu
      apt-get update
      apt-get install -y --no-install-recommends curl unzip
      rm -rf /var/lib/apt/lists/*
      aws_cli_os="$(uname -s | tr '[:upper:]' '[:lower:]')"
      aws_cli_machine="$(uname -m)"
      case "${aws_cli_os}/${aws_cli_machine}" in
        linux/x86_64) aws_cli_arch=x86_64 ;;
        linux/aarch64|linux/arm64) aws_cli_arch=aarch64 ;;
        *) echo "Unsupported AWS CLI platform: ${aws_cli_os}/${aws_cli_machine}" >&2; exit 1 ;;
      esac
      aws_cli_archive="awscli-exe-${aws_cli_os}-${aws_cli_arch}-${AWS_CLI_VERSION}.zip"
      curl --fail --location --silent --show-error "https://awscli.amazonaws.com/${aws_cli_archive}" --output "/tmp/${aws_cli_archive}"
      mkdir -p /tmp/aws-cli-install
      unzip -q "/tmp/${aws_cli_archive}" -d /tmp/aws-cli-install
      /tmp/aws-cli-install/aws/install --install-dir /usr/local/aws-cli --bin-dir /usr/local/bin --update
      rm -rf /tmp/aws-cli-install "/tmp/${aws_cli_archive}"
      aws --version
      mise install terraform
      mise exec -- terraform version
      : "${ROLE_ARN:?Configure ROLE_ARN as a protected CI/CD variable scoped to beta or *}"
      aws_sts_output="$(aws sts assume-role-with-web-identity \
        --role-arn "$ROLE_ARN" \
        --role-session-name "GitLabRunner-${CI_PROJECT_ID}-${CI_PIPELINE_ID}" \
        --web-identity-token "$GITLAB_OIDC_TOKEN" \
        --duration-seconds 3600 \
        --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' \
        --output text)"
      set -- $aws_sts_output
      export AWS_ACCESS_KEY_ID="$1"
      export AWS_SECRET_ACCESS_KEY="$2"
      export AWS_SESSION_TOKEN="$3"
      unset GITLAB_OIDC_TOKEN aws_sts_output
      export AWS_DEFAULT_REGION=us-east-1
      export TF_ROOT=terraform
      export TF_STATE_NAME=beta-app
      export TF_HTTP_USERNAME=gitlab-ci-token
      export TF_HTTP_PASSWORD="$CI_JOB_TOKEN"
      export TF_HTTP_LOCK_METHOD=POST
      export TF_HTTP_UNLOCK_METHOD=DELETE
      export TF_HTTP_RETRY_WAIT_MIN=5
      export TF_HTTP_ADDRESS="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/terraform/state/${TF_STATE_NAME}"
      export TF_HTTP_LOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
      export TF_HTTP_UNLOCK_ADDRESS="${TF_HTTP_ADDRESS}/lock"
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: sts.amazonaws.com
  environment:
    name: beta
  resource_group: beta-deployment

beta:plan:
  extends: .aws-terraform
  stage: plan
  needs:
    - job: build
      artifacts: true
  script:
    - |
      set -eu
      : "${API_BIBLE_KEY:?Set API_BIBLE_KEY as a protected CI/CD variable}"
      : "${API_BIBLE_CSB_ID:?Set API_BIBLE_CSB_ID as a protected CI/CD variable}"
      : "${API_BIBLE_NIV_ID:?Set API_BIBLE_NIV_ID as a protected CI/CD variable}"
      : "${API_BIBLE_NLT_ID:?Set API_BIBLE_NLT_ID as a protected CI/CD variable}"
      : "${CROSSWAY_KEY:?Set CROSSWAY_KEY as a protected CI/CD variable}"
      export TF_VAR_api_bible_key="$API_BIBLE_KEY"
      export TF_VAR_api_bible_csb_id="$API_BIBLE_CSB_ID"
      export TF_VAR_api_bible_niv_id="$API_BIBLE_NIV_ID"
      export TF_VAR_api_bible_nlt_id="$API_BIBLE_NLT_ID"
      export TF_VAR_crossway_key="$CROSSWAY_KEY"
      export TF_VAR_lambda_zip_path="../dist/lambda.zip"
    - mise exec -- terraform -chdir="$TF_ROOT" init -reconfigure -input=false
    - mise exec -- terraform -chdir="$TF_ROOT" plan -input=false

beta:apply:
  extends: .aws-terraform
  stage: deploy
  needs:
    - job: build
      artifacts: true
    - job: beta:plan
      artifacts: false
  script:
    - |
      set -eu
      : "${API_BIBLE_KEY:?Set API_BIBLE_KEY as a protected CI/CD variable}"
      : "${API_BIBLE_CSB_ID:?Set API_BIBLE_CSB_ID as a protected CI/CD variable}"
      : "${API_BIBLE_NIV_ID:?Set API_BIBLE_NIV_ID as a protected CI/CD variable}"
      : "${API_BIBLE_NLT_ID:?Set API_BIBLE_NLT_ID as a protected CI/CD variable}"
      : "${CROSSWAY_KEY:?Set CROSSWAY_KEY as a protected CI/CD variable}"
      export TF_VAR_api_bible_key="$API_BIBLE_KEY"
      export TF_VAR_api_bible_csb_id="$API_BIBLE_CSB_ID"
      export TF_VAR_api_bible_niv_id="$API_BIBLE_NIV_ID"
      export TF_VAR_api_bible_nlt_id="$API_BIBLE_NLT_ID"
      export TF_VAR_crossway_key="$CROSSWAY_KEY"
      export TF_VAR_lambda_zip_path="../dist/lambda.zip"
    - mise exec -- terraform -chdir="$TF_ROOT" init -reconfigure -input=false
    - |
      if mise exec -- terraform -chdir="$TF_ROOT" output -raw static_bucket >/tmp/beta-static-bucket 2>/dev/null && [ -s /tmp/beta-static-bucket ]; then
        export STATIC_BUCKET="$(cat /tmp/beta-static-bucket)"
        bash scripts/deploy/retain-beta-release.sh
      fi
    - mise exec -- terraform -chdir="$TF_ROOT" apply -input=false -auto-approve
    - |
      if mise exec -- terraform -chdir="$TF_ROOT" output -raw static_bucket >/tmp/beta-static-bucket 2>/dev/null && [ -s /tmp/beta-static-bucket ]; then
        export STATIC_BUCKET="$(mise exec -- terraform -chdir="$TF_ROOT" output -raw static_bucket)"
        export CLOUDFRONT_DISTRIBUTION_ID="$(mise exec -- terraform -chdir="$TF_ROOT" output -raw cloudfront_distribution_id)"
        bash scripts/deploy/retain-beta-release.sh
        bash scripts/deploy/publish-beta.sh
      else
        mise exec -- terraform -chdir="$TF_ROOT" output name_servers
      fi

beta:verify:
  stage: verify
  when: manual
  needs:
    - job: build
      artifacts: true
    - job: beta:apply
      artifacts: false
  script:
    - mise install node
    - mise exec -- node scripts/verify-beta.mjs https://fortheday.beckyandzac.com
